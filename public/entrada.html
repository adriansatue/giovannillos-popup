<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giovannillo's · Panel de Entrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #EC6B50;
      --bg: #FFFAF8;
      --surface: #fff;
      --text: #1A1008;
      --muted: #7A6B62;
      --border: #E8DDD8;
      --radius: 12px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.25rem 1rem 3rem;
    }
    .container { width: 100%; max-width: 960px; margin: 0 auto; }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .titulo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--text); }
    .live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .live-dot { width: 7px; height: 7px; background: #2ECC71; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
    .stat { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: .875rem; text-align: center; }
    .stat-n { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--text); line-height: 1; }
    .stat-n.verde { color: #27AE60; }
    .stat-n.naranja { color: var(--brand); }
    .stat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }

    .search {
      width: 100%; padding: 11px 14px; margin-bottom: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--text); background: var(--surface); outline: none;
      transition: border-color .15s;
    }
    .search:focus { border-color: var(--brand); }

    .lista { display: flex; flex-direction: column; gap: 6px; }
    .item {
      display: flex; align-items: center; gap: 10px;
      padding: .875rem 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
      border-left: 3px solid var(--brand);
      transition: opacity .2s;
    }
    .item.validado { border-left-color: #27AE60; opacity: .55; }
    .av {
      width: 38px; height: 38px; border-radius: 50%;
      background: #FFF5F2; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: var(--brand); flex-shrink: 0;
    }
    .av.ok { background: #EAF7EE; color: #27AE60; }
    .info { flex: 1; min-width: 0; }
    .nombre { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-val {
      padding: 7px 14px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      background: #EAF7EE; color: #1A7A3F; flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .btn-val:hover { background: #27AE60; color: #fff; }
    .btn-val:disabled { background: #EAF7EE; color: #27AE60; cursor: default; }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
    .loader { text-align: center; padding: 2rem; color: var(--muted); font-size: 14px; }

    .refresh-hint { text-align: center; margin-top: 1rem; font-size: 11px; color: var(--muted); }

    /* NOTIF BUTTON */
    .notif-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 5px 11px; cursor: pointer;
      font-size: 12px; font-weight: 500; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
      transition: all .15s; white-space: nowrap; font-family: 'DM Sans', sans-serif;
    }
    .notif-btn:hover { border-color: var(--brand); color: var(--brand); }
    .notif-btn.activo { background: #EAF7EE; border-color: #27AE60; color: #1A7A3F; }
    .notif-btn.error  { border-color: #E24B4A; color: #C0392B; }

    /* LOGIN */
    #login-screen {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .login-box { width: 100%; max-width: 340px; }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .login-logo .logo-dot {
      width: 42px; height: 42px; background: var(--brand); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .login-logo .logo-dot span { font-family: 'Bebas Neue', sans-serif; color: #fff; font-size: 22px; }
    .login-logo .logo-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--text); }
    .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; margin-bottom: .3rem; }
    .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.75rem; }
    .login-field { position: relative; margin-bottom: 1rem; }
    .login-field input {
      width: 100%; padding: 13px 44px 13px 14px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 15px; font-family: 'DM Sans', sans-serif;
      color: var(--text); background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .login-field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(236,107,80,.12); }
    .login-field input.err { border-color: #E24B4A; box-shadow: 0 0 0 3px rgba(226,75,74,.1); }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--muted);
    }
    .toggle-pw svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .login-err { font-size: 12px; color: #E24B4A; margin-bottom: 1rem; display: none; }
    .login-btn {
      width: 100%; padding: 14px;
      background: var(--brand); color: #fff; border: none;
      border-radius: var(--radius);
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px;
      cursor: pointer; transition: background .15s;
    }
    .login-btn:hover { background: #C4522F; }
    @keyframes loginShake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* TABS */
    .tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; }
    .tab { flex: 1; padding: 8px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); background: none; transition: background .15s, color .15s; }
    .tab.active { background: var(--brand); color: #fff; }
    .tab:hover:not(.active) { background: var(--bg); }

    /* PEDIDO ITEMS */
    .ped-item {
      padding: 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius);
      border-left: 3px solid var(--brand);
      margin-bottom: 6px;
    }
    .ped-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: .4rem; }
    .ped-nombre { font-size: 14px; font-weight: 500; color: var(--text); }
    .ped-franja { font-size: 11px; color: var(--brand); font-weight: 500; text-align: right; flex-shrink: 0; }
    .ped-dir { font-size: 12px; color: var(--muted); margin-bottom: .35rem; }
    .ped-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .ped-tag { font-size: 11px; background: #FFF5F2; color: var(--muted); padding: 3px 8px; border-radius: 20px; }
    .ped-tag.pizza { color: var(--brand); font-weight: 500; }
    .ped-estado { margin-left: auto; border: none; cursor: pointer; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; font-family: 'DM Sans', sans-serif; transition: opacity .15s; }
    .ped-estado[data-e="pendiente"] { background: #FFF3E0; color: #D07000; }
    .ped-estado[data-e="confirmado"] { background: #E8F4FC; color: #1565C0; }
    .ped-estado[data-e="entregado"]  { background: #EAF7EE; color: #27AE60; }

    /* TABLE */
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); border: 1px solid var(--border); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl thead th { padding: 10px 12px; background: #F7F1EE; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
    .tbl tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: #FFF5F2; }
    .tbl tbody tr.validado td { opacity: .55; }
    .td-nombre { font-weight: 500; white-space: nowrap; color: var(--text); }
    .td-muted { color: var(--muted); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .badge-ok   { background: #EAF7EE; color: #1A7A3F; }
    .badge-pend { background: #FFF5F2; color: var(--brand); }

    /* SECTION ACTIONS */
    .section-actions { display: flex; align-items: center; gap: 8px; margin-bottom: .75rem; }
    .section-actions .search { margin-bottom: 0; flex: 1; }
    .btn-export {
      padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius);
      background: #fff; color: var(--muted); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; gap: 5px;
      transition: border-color .15s, color .15s;
    }
    .btn-export:hover { border-color: var(--brand); color: var(--brand); }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-dot"><span>G</span></div>
        <div class="logo-name">Giovannillo's Pizza</div>
      </div>
      <div class="login-title">Panel de Entrada</div>
      <div class="login-sub">Acceso restringido al equipo de organización.</div>
      <div class="login-field">
        <input type="password" id="pw-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()" />
        <button class="toggle-pw" onclick="togglePw()" tabindex="-1" aria-label="Mostrar contraseña">
          <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="login-err" id="login-err">Contraseña incorrecta. Inténtalo de nuevo.</div>
      <button class="login-btn" onclick="login()">ACCEDER</button>
    </div>
  </div>

  <div id="app" style="display:none">
  <div class="container">

    <div class="topbar">
      <div class="titulo">Panel de Entrada</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="notif-btn" id="notif-btn" onclick="toggleNotifs()">🔔 Notificaciones</button>
        <div class="live"><div class="live-dot"></div>En vivo</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-reg" onclick="setTab('reg')">Registros</button>
      <button class="tab" id="tab-ped" onclick="setTab('ped')">Pedidos de Muestra</button>
    </div>

    <div id="section-reg">
      <div class="stats">
        <div class="stat"><div class="stat-n" id="st">—</div><div class="stat-l">Total</div></div>
        <div class="stat"><div class="stat-n verde" id="sok">—</div><div class="stat-l">Validados</div></div>
        <div class="stat"><div class="stat-n naranja" id="sp">—</div><div class="stat-l">Pendientes</div></div>
      </div>
      <div class="section-actions">
        <input class="search" type="text" id="q" placeholder="Buscar por nombre o email..." oninput="render()" />
        <button class="btn-export" onclick="exportCSV('reg')">⬇ CSV</button>
      </div>
      <div class="tbl-wrap" id="lista">
        <div class="loader">Cargando...</div>
      </div>
    </div>

    <div id="section-ped" style="display:none">
      <div class="stats">
        <div class="stat"><div class="stat-n" id="pt">—</div><div class="stat-l">Pedidos</div></div>
        <div class="stat"><div class="stat-n naranja" id="pp-total">—</div><div class="stat-l">Pizzas</div></div>
        <div class="stat"><div class="stat-n verde" id="pp-prox">—</div><div class="stat-l">Próxima</div></div>
      </div>
      <div class="section-actions">
        <input class="search" type="text" id="qp" placeholder="Buscar por nombre, email o dirección..." oninput="renderPedidos()" />
        <button class="btn-export" onclick="exportCSV('ped')">⬇ CSV</button>
      </div>
      <div class="tbl-wrap" id="lista-ped">
        <div class="loader">Cargando...</div>
      </div>
    </div>

    <div class="refresh-hint">Actualización automática cada 4s</div>
  </div>
  </div> <!-- /app -->

  <script>
    // SHA-256 hash of: Giov@nnill0s#2026
    const PW_HASH = '2909453f9eb38461afa5bc62e639dca7dab1051b1d6f9fdcdfa0b6565b3e2ed1';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function login() {
      const val = document.getElementById('pw-input').value;
      const hash = await sha256(val);
      if (hash === PW_HASH) {
        sessionStorage.setItem('gv_auth', '1');
        sessionStorage.setItem('gv_tok', hash);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadData(); loadPedidos();
        setInterval(() => { loadData(); loadPedidos(); }, 4000);
      } else {
        const inp = document.getElementById('pw-input');
        const err = document.getElementById('login-err');
        inp.classList.add('err');
        err.style.display = 'block';
        inp.style.animation = 'loginShake .4s ease';
        setTimeout(() => { inp.style.animation = ''; inp.classList.remove('err'); }, 400);
      }
    }

    function togglePw() {
      const inp = document.getElementById('pw-input');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function tok() { return sessionStorage.getItem('gv_tok') || ''; }

    // Check session on load
    if (sessionStorage.getItem('gv_auth') === '1') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }

    let db = [];

    function ini(nombre) {
      const p = nombre.trim().split(' ').filter(Boolean);
      return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
    }

    async function loadData() {
      try {
        const res = await fetch('/api/registros', { headers: { 'x-session': tok() } });
        if (res.ok) { db = await res.json(); render(); }
      } catch (e) { /* silent */ }
    }

    async function validar(email) {
      const btn = document.querySelector(`[data-email="${CSS.escape(email)}"]`);
      if (btn) { btn.disabled = true; btn.textContent = '...'; }
      try {
        await fetch('/api/validar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-session': tok() },
          body: JSON.stringify({ email })
        });
        await loadData();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = 'Validar'; }
      }
    }

    function render() {
      const q = (document.getElementById('q').value || '').toLowerCase();
      const list = db
        .filter(r => !q || r.nombre.toLowerCase().includes(q) || r.email.toLowerCase().includes(q))
        .sort((a, b) => a.entrada - b.entrada);

      document.getElementById('st').textContent = db.length;
      document.getElementById('sok').textContent = db.filter(r => r.entrada).length;
      document.getElementById('sp').textContent = db.filter(r => !r.entrada).length;

      const el = document.getElementById('lista');
      if (!list.length) {
        el.innerHTML = '<div class="empty">Sin registros aún</div>';
        return;
      }
      el.innerHTML = '<table class="tbl"><thead><tr>'
        + '<th>Nombre</th><th>Email</th><th>CP</th><th>Estado</th><th></th>'
        + '</tr></thead><tbody>'
        + list.map(r => '<tr class="' + (r.entrada ? 'validado' : '') + '">'
          + '<td class="td-nombre">' + esc(r.nombre) + '</td>'
          + '<td class="td-muted">'  + esc(r.email)  + '</td>'
          + '<td class="td-muted">'  + esc(r.cp || '—') + '</td>'
          + '<td><span class="badge ' + (r.entrada ? 'badge-ok' : 'badge-pend') + '">'
            + (r.entrada ? '✓ Validado' : 'Pendiente') + '</span></td>'
          + '<td>' + (r.entrada ? '' : '<button class="btn-val" data-email="' + esc(r.email)
            + '" onclick="validar(this.dataset.email)">Validar</button>') + '</td>'
          + '</tr>'
        ).join('')
        + '</tbody></table>';
    }

    // === Pedidos de Muestra ===
    let tab = 'reg';

    function setTab(name) {
      tab = name;
      document.getElementById('section-reg').style.display = name === 'reg' ? '' : 'none';
      document.getElementById('section-ped').style.display = name === 'ped' ? '' : 'none';
      document.getElementById('tab-reg').classList.toggle('active', name === 'reg');
      document.getElementById('tab-ped').classList.toggle('active', name === 'ped');
    }

    let dbPed = [];
    const DIAS_PED  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const MESES_PED = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

    async function loadPedidos() {
      try {
        const res = await fetch('/api/pedidos', { headers: { 'x-session': tok() } });
        if (res.ok) { dbPed = await res.json(); renderPedidos(); }
      } catch (e) { /* silent */ }
    }

    function franjaFmt(iso) {
      const d = new Date(iso);
      return DIAS_PED[d.getDay()] + ' ' + d.getDate() + ' ' + MESES_PED[d.getMonth()] + ' · ' + d.getHours() + ':00–' + (d.getHours()+2) + ':00';
    }

    const ESTADOS_CYCLE = ['pendiente', 'confirmado', 'entregado'];
    const ESTADO_LABEL  = { pendiente: 'Pendiente', confirmado: 'Confirmado', entregado: 'Entregado' };

    function renderPedidos() {
      const q = (document.getElementById('qp')?.value || '').toLowerCase();
      const list = dbPed.filter(p => !q ||
        p.nombre.toLowerCase().includes(q) ||
        (p.email||'').toLowerCase().includes(q) ||
        (p.calle||'').toLowerCase().includes(q) ||
        (p.poblacion||'').toLowerCase().includes(q)
      );

      document.getElementById('pt').textContent = dbPed.length;
      document.getElementById('pp-total').textContent = dbPed.reduce((s,p) => s + (p.total||0), 0);
      const ahora = new Date();
      const prox = dbPed.filter(p => new Date(p.franja) > ahora).sort((a,b) => new Date(a.franja)-new Date(b.franja))[0];
      document.getElementById('pp-prox').textContent = prox
        ? (new Date(prox.franja).getDate() + '/' + (new Date(prox.franja).getMonth()+1))
        : '—';

      const el = document.getElementById('lista-ped');
      if (!list.length) { el.innerHTML = '<div class="empty">Sin pedidos aún</div>'; return; }

      el.innerHTML = '<table class="tbl"><thead><tr>'
        + '<th>Nombre</th><th>Email</th><th>Teléfono</th><th>Dirección</th><th>Franja</th><th>Pizzas</th><th>Estado</th>'
        + '</tr></thead><tbody>'
        + list.map(p => {
            const fr = p.franja ? franjaFmt(p.franja) : '—';
            const cpPob = (p.cp || '') + (p.poblacion ? ' ' + p.poblacion : '');
            const dir = [p.calle, cpPob].filter(Boolean).join(', ');
            const pizzas = [
              p.carbonara  ? p.carbonara  + ' Carbonara' : '',
              p.seisquesos ? p.seisquesos + ' 6 Quesos'  : ''
            ].filter(Boolean).join(' · ') || '—';
            const estado = p.estado || 'pendiente';
            return '<tr>'
              + '<td class="td-nombre">' + esc(p.nombre)          + '</td>'
              + '<td class="td-muted">'  + esc(p.email    || '—') + '</td>'
              + '<td class="td-muted">'  + esc(p.telefono || '—') + '</td>'
              + '<td class="td-muted">'  + esc(dir        || '—') + '</td>'
              + '<td class="td-muted" style="white-space:nowrap">' + esc(fr) + '</td>'
              + '<td class="td-muted">'  + esc(pizzas) + '</td>'
              + '<td><button class="ped-estado" data-e="' + estado + '" onclick="cambiarEstado(\'' + p.id + '\')">' + ESTADO_LABEL[estado] + '</button></td>'
              + '</tr>';
          }).join('')
        + '</tbody></table>';
    }

    async function cambiarEstado(id) {
      const pedido = dbPed.find(p => p.id === id);
      if (!pedido) return;
      const idx  = ESTADOS_CYCLE.indexOf(pedido.estado || 'pendiente');
      const next = ESTADOS_CYCLE[(idx + 1) % ESTADOS_CYCLE.length];
      pedido.estado = next;   // optimistic
      renderPedidos();
      try {
        await fetch('/api/actualizar-pedido', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-session': tok() },
          body: JSON.stringify({ id, estado: next })
        });
      } catch (e) {
        pedido.estado = ESTADOS_CYCLE[idx]; // revert
        renderPedidos();
      }
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function exportCSV(type) {
      let rows, filename;
      if (type === 'reg') {
        rows = [['Nombre','Email','CP','Estado']].concat(
          db.map(r => [r.nombre, r.email, r.cp||'', r.entrada ? 'Validado' : 'Pendiente'])
        );
        filename = 'registros.csv';
      } else {
        rows = [['Nombre','Email','Teléfono','Calle','CP','Población','Franja','Carbonara','6 Quesos','Total','Estado']].concat(
          dbPed.map(p => [
            p.nombre, p.email||'', p.telefono||'',
            p.calle||'', p.cp||'', p.poblacion||'',
            p.franja ? new Date(p.franja).toLocaleString('es-ES') : '',
            p.carbonara||0, p.seisquesos||0, p.total||0,
            p.estado||'pendiente'
          ])
        );
        filename = 'pedidos.csv';
      }
      const csv = rows.map(r =>
        r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')
      ).join('\r\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    if (sessionStorage.getItem('gv_auth') === '1') {
      loadData(); loadPedidos();
      setInterval(() => { loadData(); loadPedidos(); }, 4000);
    }

    // === Push Notifications ===
    let pushSub = null;

    async function toggleNotifs() {
      const btn = document.getElementById('notif-btn');
      if (pushSub) {
        try {
          await fetch('/api/subscribe-push', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'x-session': tok() },
            body: JSON.stringify({ endpoint: pushSub.endpoint })
          });
          await pushSub.unsubscribe();
        } catch (e) { /* silent */ }
        pushSub = null;
        btn.textContent = '🔔 Notificaciones';
        btn.classList.remove('activo', 'error');
        return;
      }

      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        btn.classList.add('error');
        btn.textContent = '⚠ No soportado';
        return;
      }

      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        btn.classList.add('error');
        btn.textContent = '✗ Bloqueado';
        return;
      }

      try {
        btn.textContent = '…';
        const vapidRes = await fetch('/api/vapid-key').then(r => r.json());
        const publicKey = vapidRes.publicKey;
        if (!publicKey) throw new Error('VAPID no configurado en el servidor');

        // Unsubscribe any existing sub with a different key before resubscribing
        const regExist = await navigator.serviceWorker.getRegistration('/sw.js');
        if (regExist) {
          const oldSub = await regExist.pushManager.getSubscription();
          if (oldSub) await oldSub.unsubscribe();
        }

        const reg = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });

        const saveRes = await fetch('/api/subscribe-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-session': tok() },
          body: JSON.stringify(sub.toJSON())
        });
        if (!saveRes.ok) throw new Error('Error al guardar suscripción en servidor');

        pushSub = sub;
        btn.textContent = '🔔 Activo';
        btn.classList.add('activo');
      } catch (e) {
        console.error('[Push] Error al suscribir:', e.message);
        btn.classList.add('error');
        btn.textContent = '⚠ ' + (e.message.length < 40 ? e.message : 'Error');
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw     = atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    // Restore subscription — verify VAPID key still matches
    (async () => {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        const reg = await navigator.serviceWorker.getRegistration('/sw.js');
        if (!reg) return;
        const sub = await reg.pushManager.getSubscription();
        if (!sub) return;

        // Compare stored subscription key with current VAPID public key
        const { publicKey } = await fetch('/api/vapid-key').then(r => r.json()).catch(() => ({}));
        if (publicKey && sub.options?.applicationServerKey) {
          const storedKey = btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
          if (storedKey !== publicKey) {
            // Key mismatch: old subscription is invalid, force resubscribe
            await sub.unsubscribe();
            console.warn('[Push] Clave VAPID cambiada — haz clic en Notificaciones para reactivar');
            return;
          }
        }

        pushSub = sub;
        const btn = document.getElementById('notif-btn');
        if (btn) { btn.textContent = '🔔 Activo'; btn.classList.add('activo'); }
      } catch (e) { /* silent */ }
    })();
  </script>
</body>
